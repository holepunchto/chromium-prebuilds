name: Prebuild
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
jobs:
  version:
    runs-on: ubuntu-latest
    name: Version
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: holepunchto/actions/checkout@v1
      - id: version
        name: Version
        run: |
          version=$(sed -n 's/^ *"chromium_version": "\(.*\)",$/\1/p' DEPS)

          if [ -z "$version" ]; then
            echo "::error::No Chromium version found in DEPS"
            exit 1
          fi

          if gh release view "v$version" > /dev/null 2>&1; then
            echo "::error::Release v$version already exists"
            exit 1
          fi

          echo "version=$version" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

  linux:
    runs-on: prebuilds-linux-x64
    environment:
      name: chromium
    needs: version
    name: Linux
    steps:
      - name: Install
        run: |
          if [ ! -d "depot_tools" ]; then
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          fi

          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

          echo "$GITHUB_WORKSPACE/depot_tools/python-bin" >> $GITHUB_PATH

          mkdir -p chromium

      - name: Download
        working-directory: chromium
        run: |
          cat <<EOF > .gclient
          solutions = [
            { "name": "src/prebuilds",
              "url": "https://github.com/${{ github.repository }}.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {
                "checkout_pgo_profiles": True
              },
            },
          ]
          target_os = ["linux", "android"]
          target_cpu = ["x64", "x86", "arm64", "arm"]
          EOF

          if [ -d src/.git ]; then
            mkdir -p src/.git/info
            grep -qxF "/prebuilds/" src/.git/info/exclude 2>/dev/null || echo "/prebuilds/" >> src/.git/info/exclude
          fi

          gclient sync -D --force -j 4 --revision src/prebuilds@$GITHUB_REF

          ./src/build/linux/sysroot_scripts/install-sysroot.py --arch=arm64
          ./src/build/linux/sysroot_scripts/install-sysroot.py --arch=x64

          if [ ! -d "buildtools" ]; then
            ln -s src/buildtools buildtools
          fi

      - name: Patch
        working-directory: chromium
        run: git apply --directory src src/prebuilds/patches/*.patch

      - working-directory: chromium/src
        run: gn gen out/linux-arm64/v8 --args="import(\"//prebuilds/v8-linux-arm64-release.gni\")"
      - working-directory: chromium/src
        run: ninja -C out/linux-arm64/v8 prebuilds
      - uses: holepunchto/actions/create-archive@v1
        with:
          directory: chromium/src/out/linux-arm64/v8/package
          paths: v8 c++
          name: archives/linux-arm64
          format: tar.xz

      - working-directory: chromium/src
        run: gn gen out/linux-x64/v8 --args="import(\"//prebuilds/v8-linux-x64-release.gni\")"
      - working-directory: chromium/src
        run: ninja -C out/linux-x64/v8 prebuilds
      - uses: holepunchto/actions/create-archive@v1
        with:
          directory: chromium/src/out/linux-x64/v8/package
          paths: v8 c++
          name: archives/linux-x64
          format: tar.xz

      - working-directory: chromium/src
        run: gn gen out/android-arm/v8 --args="import(\"//prebuilds/v8-android-arm-release.gni\")"
      - working-directory: chromium/src
        run: ninja -C out/android-arm/v8 prebuilds
      - uses: holepunchto/actions/create-archive@v1
        with:
          directory: chromium/src/out/android-arm/v8/package
          paths: v8 c++
          name: archives/android-arm
          format: tar.xz

      - working-directory: chromium/src
        run: gn gen out/android-arm64/v8 --args="import(\"//prebuilds/v8-android-arm64-release.gni\")"
      - working-directory: chromium/src
        run: ninja -C out/android-arm64/v8 prebuilds
      - uses: holepunchto/actions/create-archive@v1
        with:
          directory: chromium/src/out/android-arm64/v8/package
          paths: v8 c++
          name: archives/android-arm64
          format: tar.xz

      - working-directory: chromium/src
        run: gn gen out/android-ia32/v8 --args="import(\"//prebuilds/v8-android-ia32-release.gni\")"
      - working-directory: chromium/src
        run: ninja -C out/android-ia32/v8 prebuilds
      - uses: holepunchto/actions/create-archive@v1
        with:
          directory: chromium/src/out/android-ia32/v8/package
          paths: v8 c++
          name: archives/android-ia32
          format: tar.xz

      - working-directory: chromium/src
        run: gn gen out/android-x64/v8 --args="import(\"//prebuilds/v8-android-x64-release.gni\")"
      - working-directory: chromium/src
        run: ninja -C out/android-x64/v8 prebuilds
      - uses: holepunchto/actions/create-archive@v1
        with:
          directory: chromium/src/out/android-x64/v8/package
          paths: v8 c++
          name: archives/android-x64
          format: tar.xz

      - uses: holepunchto/actions/upload-artifact@v1
        with:
          name: linux
          path: archives/*.tar.xz
          retention-days: 5

      - name: Clean
        if: always()
        working-directory: chromium/src
        run: |
          gclient recurse --ignore --no-progress -j1 --scm git git rebase --abort 2>/dev/null
          gclient recurse --ignore --no-progress -j1 --scm git git checkout --quiet --detach
          gclient recurse --ignore --no-progress -j1 --scm git git reset --quiet --hard HEAD
          gclient recurse --ignore --no-progress -j1 --scm git git clean -ffdq

          rm -rf "$GITHUB_WORKSPACE/archives"

  apple:
    runs-on: prebuilds-macos-arm64
    environment:
      name: chromium
    needs: version
    name: Apple
    steps:
      - name: Install
        run: |
          if [ ! -d "depot_tools" ]; then
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          fi

          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

          echo "$GITHUB_WORKSPACE/depot_tools/python-bin" >> $GITHUB_PATH

          mkdir -p chromium

      - name: Download
        working-directory: chromium
        run: |
          cat <<EOF > .gclient
          solutions = [
            { "name": "src/prebuilds",
              "url": "https://github.com/${{ github.repository }}.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {
                "checkout_pgo_profiles": True
              },
            },
          ]
          target_os = ["mac", "ios"]
          target_cpu = ["x64", "arm64"]
          EOF

          if [ -d src/.git ]; then
            mkdir -p src/.git/info
            grep -qxF "/prebuilds/" src/.git/info/exclude 2>/dev/null || echo "/prebuilds/" >> src/.git/info/exclude
          fi

          gclient sync -D --force -j 4 --revision src/prebuilds@$GITHUB_REF

          if [ ! -d "buildtools" ]; then
            ln -s src/buildtools buildtools
          fi

      - name: Patch
        working-directory: chromium
        run: git apply --directory src src/prebuilds/patches/*.patch

      - working-directory: chromium/src
        run: gn gen out/darwin-arm64/v8 --args="import(\"//prebuilds/v8-darwin-arm64-release.gni\")"
      - working-directory: chromium/src
        run: ninja -C out/darwin-arm64/v8 prebuilds
      - uses: holepunchto/actions/create-archive@v1
        with:
          directory: chromium/src/out/darwin-arm64/v8/package
          paths: v8 c++
          name: archives/darwin-arm64
          format: tar.xz

      - working-directory: chromium/src
        run: gn gen out/darwin-x64/v8 --args="import(\"//prebuilds/v8-darwin-x64-release.gni\")"
      - working-directory: chromium/src
        run: ninja -C out/darwin-x64/v8 prebuilds
      - uses: holepunchto/actions/create-archive@v1
        with:
          directory: chromium/src/out/darwin-x64/v8/package
          paths: v8 c++
          name: archives/darwin-x64
          format: tar.xz

      - working-directory: chromium/src
        run: gn gen out/ios-arm64/v8 --args="import(\"//prebuilds/v8-ios-arm64-release.gni\")"
      - working-directory: chromium/src
        run: ninja -C out/ios-arm64/v8 prebuilds
      - uses: holepunchto/actions/create-archive@v1
        with:
          directory: chromium/src/out/ios-arm64/v8/package
          paths: v8 c++
          name: archives/ios-arm64
          format: tar.xz

      - working-directory: chromium/src
        run: gn gen out/ios-arm64-simulator/v8 --args="import(\"//prebuilds/v8-ios-arm64-simulator-release.gni\")"
      - working-directory: chromium/src
        run: ninja -C out/ios-arm64-simulator/v8 prebuilds
      - uses: holepunchto/actions/create-archive@v1
        with:
          directory: chromium/src/out/ios-arm64-simulator/v8/package
          paths: v8 c++
          name: archives/ios-arm64-simulator
          format: tar.xz

      - working-directory: chromium/src
        run: gn gen out/ios-x64-simulator/v8 --args="import(\"//prebuilds/v8-ios-x64-simulator-release.gni\")"
      - working-directory: chromium/src
        run: ninja -C out/ios-x64-simulator/v8 prebuilds
      - uses: holepunchto/actions/create-archive@v1
        with:
          directory: chromium/src/out/ios-x64-simulator/v8/package
          paths: v8 c++
          name: archives/ios-x64-simulator
          format: tar.xz

      - uses: holepunchto/actions/upload-artifact@v1
        with:
          name: apple
          path: archives/*.tar.xz
          retention-days: 5

      - name: Clean
        if: always()
        working-directory: chromium/src
        run: |
          gclient recurse --ignore --no-progress -j1 --scm git git rebase --abort 2>/dev/null
          gclient recurse --ignore --no-progress -j1 --scm git git checkout --quiet --detach
          gclient recurse --ignore --no-progress -j1 --scm git git reset --quiet --hard HEAD
          gclient recurse --ignore --no-progress -j1 --scm git git clean -ffdq

          rm -rf "$GITHUB_WORKSPACE/archives"

  windows:
    runs-on: prebuilds-win32-x64
    environment:
      name: chromium
    needs: version
    name: Windows
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0
      CIPD_CACHE_DIR: ${{ github.workspace }}\.cipd_cache
    steps:
      - name: Install
        run: |
          if (-not (Test-Path "depot_tools" -PathType Container)) {
              git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          }

          "$env:GITHUB_WORKSPACE\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          "$env:GITHUB_WORKSPACE\depot_tools\python-bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          New-Item -ItemType Directory -Force -Path "chromium" | Out-Null

      - name: Download
        working-directory: chromium
        run: |
          @'
          solutions = [
            { "name": "src/prebuilds",
              "url": "https://github.com/${{ github.repository }}.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {
                "checkout_pgo_profiles": True
              },
            },
          ]
          target_os = ["win"]
          target_cpu = ["x64", "arm64"]
          '@ | Out-File -FilePath ".gclient" -Encoding utf8

          if (Test-Path "src/.git" -PathType Container) {
              New-Item -ItemType Directory -Force -Path "src/.git/info" | Out-Null

              $exclude = "src/.git/info/exclude"

              if (-not ((Test-Path $exclude) -and (@(Get-Content $exclude) -contains "/prebuilds/"))) {
                  Add-Content -Path $exclude -Value "/prebuilds/"
              }
          }

          gclient sync -D --force -j 4 --revision "src/prebuilds@$env:GITHUB_REF"

          if (-not (Test-Path "buildtools" -PathType Container)) {
              New-Item -ItemType Junction -Path "buildtools" -Target (Resolve-Path "src/buildtools").Path | Out-Null
          }

      - name: Patch
        working-directory: chromium
        run: |
          Get-ChildItem "src/prebuilds/patches" -Filter "*.patch" | ForEach-Object {
            git apply --directory src $_.FullName
          }

      - working-directory: chromium/src
        run: gn gen out/win32-arm64/v8 --args="import(\`"//prebuilds/v8-win32-arm64-release.gni\`")"
      - working-directory: chromium/src
        run: ninja -C out/win32-arm64/v8 prebuilds
      - uses: holepunchto/actions/create-archive@v1
        with:
          directory: chromium/src/out/win32-arm64/v8/package
          paths: v8 c++
          name: archives/win32-arm64
          format: tar.xz

      - working-directory: chromium/src
        run: gn gen out/win32-x64/v8 --args="import(\`"//prebuilds/v8-win32-x64-release.gni\`")"
      - working-directory: chromium/src
        run: ninja -C out/win32-x64/v8 prebuilds
      - uses: holepunchto/actions/create-archive@v1
        with:
          directory: chromium/src/out/win32-x64/v8/package
          paths: v8 c++
          name: archives/win32-x64
          format: tar.xz

      - uses: holepunchto/actions/upload-artifact@v1
        with:
          name: windows
          path: archives/*.tar.xz
          retention-days: 5

      - name: Clean
        if: always()
        working-directory: chromium/src
        run: |
          gclient recurse --ignore --no-progress -j1 --scm git git rebase --abort 2>$null
          gclient recurse --ignore --no-progress -j1 --scm git git checkout --quiet --detach
          gclient recurse --ignore --no-progress -j1 --scm git git reset --quiet --hard HEAD
          gclient recurse --ignore --no-progress -j1 --scm git git clean -ffdq

          Remove-Item -Recurse -Force "$env:GITHUB_WORKSPACE/archives" -ErrorAction SilentlyContinue

  release:
    runs-on: ubuntu-latest
    environment:
      name: github
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs:
      - linux
      - apple
      - windows
    name: Release
    steps:
      - uses: holepunchto/actions/checkout@v1
      - uses: holepunchto/actions/download-prebuilds@v1
        with:
          prefix: archives
      - working-directory: archives
        run: sha256sum *.tar.xz > SHA256SUMS
      - uses: holepunchto/actions/attest@v1
        with:
          subject-path: archives/*.tar.xz
      - uses: holepunchto/actions/create-github-release@v1
        with:
          tag: v${{ needs.version.outputs.version }}
          files: archives/*.tar.xz archives/SHA256SUMS
          draft: true
